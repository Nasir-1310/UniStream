services:
  - type: web
    name: unistream-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker: daily-limit reservations and rate limits live in memory.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # SECRET. A long random value (32+ characters). First admin sign-in:
      # username "admin" + this value, after which the dashboard asks you to
      # choose your own username and password. It also stays valid as an API
      # key for scripts (x-admin-secret header).
      - key: ADMIN_SECRET
        sync: false
      # Optional: the admin username used before you choose your own (default "admin").
      - key: ADMIN_USERNAME
        sync: false
      # Optional SECRET: a first-sign-in password other than ADMIN_SECRET.
      # Remove it once you have chosen your own admin password.
      - key: ADMIN_PASSWORD
        sync: false
      # Recovery only: set to "true" if you forget the admin password, sign in
      # with ADMIN_SECRET (or ADMIN_PASSWORD), choose a new password, then
      # delete this variable again.
      - key: ADMIN_RESET_PASSWORD
        sync: false
      # SECRET. Signs user sessions, password-reset links, admin sessions and
      # download tickets. Render generates a random value once; changing it
      # signs everyone out.
      - key: AUTH_SECRET
        generateValue: true
      # Public URL of the Next.js site (used in emails and for CORS). Several
      # origins may be separated by commas; the first one is used in emails.
      - key: FRONTEND_URL
        sync: false
      # Daily download limits reset at local midnight in this zone.
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      # Email for approvals and password resets: auto | brevo | resend | smtp | none.
      # Render's free instances block outbound SMTP ports, so use an HTTP
      # provider: Brevo's free plan sends 300 emails/day from a verified sender.
      - key: EMAIL_PROVIDER
        value: auto
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Sender address, e.g. unistream.saver@gmail.com (verified with the provider).
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: UniStream Saver
      # SMTP is only for hosts that allow outbound SMTP (not Render's free plan).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SSL
        sync: false
      # Base64-encoded Netscape cookies.txt export for youtube.com. Configure
      # this as a secret in Render; never commit the cookie file itself.
      - key: YOUTUBE_COOKIES_BASE64
        sync: false
      # Same format, for instagram.com / facebook.com: they answer data-centre
      # IPs with HTTP 429 or a login wall without a signed-in session.
      - key: INSTAGRAM_COOKIES_BASE64
        sync: false
      - key: FACEBOOK_COOKIES_BASE64
        sync: false
      # Optional: the exact User-Agent from the browser that exported cookies.
      - key: YOUTUBE_USER_AGENT
        sync: false
      # Optional: residential proxy for YouTube when it refuses Render's IP,
      # e.g. http://user:pass@host:port. Must keep one exit IP (sticky
      # session): YouTube stream links are bound to the requesting IP.
      - key: YOUTUBE_PROXY
        sync: false
      # Free alternative when YouTube refuses Render's IP: "true" sends YouTube
      # traffic through Cloudflare WARP (backend/warp_proxy.py). YOUTUBE_PROXY
      # wins when both are set. YouTube may refuse WARP's IPs too.
      - key: YOUTUBE_WARP
        sync: false
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "5"
